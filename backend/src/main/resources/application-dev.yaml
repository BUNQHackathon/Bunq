aws:
  account-id: ${AWS_ACCOUNT_ID:}
  profile: default
  s3:
    uploads-bucket: ${UPLOADS_BUCKET:}
  bedrock:
    kb-data-source-id: ${WARMUP_KB_DS_ID:}
    kb:
      regulations-id: ${KB_REGULATIONS_ID:}
      policies-id: ${KB_POLICIES_ID:}
      controls-id: ${KB_CONTROLS_ID:}
      regulations-data-source-id: ${KB_REGULATIONS_DATA_SOURCE_ID:}
      policies-data-source-id: ${KB_POLICIES_DATA_SOURCE_ID:}
      controls-data-source-id: ${KB_CONTROLS_DATA_SOURCE_ID:}
      regulations-source-bucket: ${KB_REGULATIONS_SOURCE_BUCKET:}
      policies-source-bucket: ${KB_POLICIES_SOURCE_BUCKET:}
      controls-source-bucket: ${KB_CONTROLS_SOURCE_BUCKET:}

cors:
  allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174

app:
  admin:
    token: ${ADMIN_TOKEN:dev-admin}

sidecar:
  base-url: http://localhost:8001
  token: ${SIDECAR_TOKEN:dev}
